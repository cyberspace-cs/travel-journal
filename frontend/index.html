<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行手帐 AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #f8f5ee 0%, #f0ebe0 100%);
            min-height: 100vh;
            color: #2d5a3d;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #2d5a3d;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .header p {
            font-size: 13px;
            color: #8a9a8f;
        }

        /* 上传页 */
        .upload-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(45, 90, 61, 0.08);
            margin-bottom: 24px;
        }

        .upload-area {
            border: 2px dashed #d4c9b8;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #2d5a3d;
            background: #faf8f3;
        }

        .upload-area .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-area p {
            color: #8a9a8f;
            font-size: 14px;
        }

        .mode-select {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e5e0d5;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active {
            border-color: #2d5a3d;
            background: rgba(45, 90, 61, 0.05);
        }

        .mode-btn .label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .mode-btn .desc {
            font-size: 11px;
            color: #8a9a8f;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #2d5a3d;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: #1e4028;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .progress.active {
            display: block;
        }

        .progress p {
            font-size: 13px;
            color: #8a9a8f;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e5e0d5;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #2d5a3d;
            transition: width 0.3s;
        }

        /* 结果页 */
        .result-card {
            display: none;
        }

        .result-card.active {
            display: block;
        }

        /* 金句卡 */
        .quote-card {
            background: linear-gradient(135deg, #2d5a3d 0%, #1e4028 100%);
            border-radius: 20px;
            padding: 28px 24px;
            color: white;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .quote-card::before {
            content: """;
            position: absolute;
            top: -10px;
            left: 16px;
            font-size: 80px;
            opacity: 0.1;
            font-family: serif;
        }

        .quote-label {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .quote-text {
            font-size: 20px;
            line-height: 1.6;
            font-weight: 500;
        }

        /* 语音播放 */
        .audio-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 12px rgba(45, 90, 61, 0.06);
        }

        .play-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2d5a3d;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .audio-info {
            flex: 1;
        }

        .audio-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .audio-duration {
            font-size: 12px;
            color: #8a9a8f;
        }

        /* 手帐内容 */
        .journal-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(45, 90, 61, 0.08);
            margin-bottom: 20px;
        }

        .journal-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #2d5a3d;
        }

        .journal-content {
            font-size: 15px;
            line-height: 1.8;
            color: #4a5a4f;
            white-space: pre-wrap;
        }

        /* 时间线 */
        .timeline {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(45, 90, 61, 0.08);
            margin-bottom: 20px;
        }

        .timeline-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2d5a3d;
        }

        .timeline-item {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            position: relative;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-time {
            flex-shrink: 0;
            width: 50px;
            font-size: 12px;
            color: #8a9a8f;
            padding-top: 2px;
        }

        .timeline-dot {
            flex-shrink: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #2d5a3d;
            margin-top: 4px;
            position: relative;
        }

        .timeline-dot::after {
            content: "";
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: calc(100% + 8px);
            background: #e5e0d5;
        }

        .timeline-item:last-child .timeline-dot::after {
            display: none;
        }

        .timeline-content {
            flex: 1;
            padding-bottom: 8px;
        }

        .timeline-tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(45, 90, 61, 0.1);
            color: #2d5a3d;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        .timeline-text {
            font-size: 14px;
            line-height: 1.6;
            color: #4a5a4f;
        }

        /* 自评 */
        .eval-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(45, 90, 61, 0.06);
        }

        .eval-title {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 12px;
            color: #8a9a8f;
        }

        .eval-score {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .eval-item {
            text-align: center;
        }

        .eval-num {
            font-size: 18px;
            font-weight: 600;
            color: #2d5a3d;
        }

        .eval-label {
            font-size: 11px;
            color: #8a9a8f;
            margin-top: 2px;
        }

        /* 操作按钮 */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e5e0d5;
            background: white;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            color: #2d5a3d;
        }

        .action-btn.primary {
            background: #2d5a3d;
            color: white;
            border-color: #2d5a3d;
        }

        .action-btn:hover {
            border-color: #2d5a3d;
        }

        /* 大屏适配 */
        @media (min-width: 768px) {
            .container {
                padding: 60px 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .upload-card, .journal-card, .timeline {
                padding: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>旅行的声音，我帮你留着</h1>
            <p>白天你玩你的，晚上手帐自己长出来</p>
        </div>

        <!-- 上传页 -->
        <div class="upload-card" id="uploadSection">
            <div class="upload-area" id="uploadArea">
                <div class="icon">🎙️</div>
                <p>点击上传录音文件</p>
                <p style="font-size: 12px; margin-top: 8px;">支持 mp3 / wav / m4a</p>
                <input type="file" id="fileInput" accept="audio/*" hidden>
            </div>

            <div class="mode-select">
                <div class="mode-btn active" data-mode="quick">
                    <div class="label">⚡ 快速生成</div>
                    <div class="desc">~15 秒出结果</div>
                </div>
                <div class="mode-btn" data-mode="deep">
                    <div class="label">✨ 深度生成</div>
                    <div class="desc">~30 秒，更有温度</div>
                </div>
            </div>

            <div style="margin: 16px 0 12px; font-size: 13px; color: #8a9a8f; text-align: center;">选择内容类型</div>
            <div class="mode-select" id="contentTypeSelect">
                <div class="mode-btn active" data-type="auto">
                    <div class="label">🤖 自动识别</div>
                    <div class="desc">AI 判断内容类型</div>
                </div>
                <div class="mode-btn" data-type="travel">
                    <div class="label">✈️ 旅行手帐</div>
                    <div class="desc">旅行见闻记录</div>
                </div>
                <div class="mode-btn" data-type="work">
                    <div class="label">📋 工作摘要</div>
                    <div class="desc">会议/工作要点</div>
                </div>
            </div>

            <button class="submit-btn" id="submitBtn">开始生成</button>

            <div class="progress" id="progress">
                <p>正在处理中...</p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <!-- 结果页 -->
        <div class="result-card" id="resultSection">
            <!-- 金句卡 -->
            <div class="quote-card">
                <div class="quote-label">今日金句</div>
                <div class="quote-text" id="quoteText"></div>
            </div>

            <!-- 语音播放 -->
            <div class="audio-card">
                <button class="play-btn" id="playBtn">▶</button>
                <div class="audio-info">
                    <div class="audio-title">手帐语音版</div>
                    <div class="audio-duration" id="audioDuration">点击播放</div>
                </div>
                <audio id="audioPlayer" preload="metadata"></audio>
            </div>

            <!-- 手帐内容 -->
            <div class="journal-card">
                <div class="journal-title" id="resultTitle"></div>
                <div class="journal-content" id="resultContent"></div>
            </div>

            <!-- 时间线 -->
            <div class="timeline">
                <div class="timeline-title">📅 今日时间线</div>
                <div id="timelineList"></div>
            </div>

            <!-- 自评 -->
            <div class="eval-card">
                <div class="eval-title">AI 自评</div>
                <div class="eval-score" id="evalScores"></div>
            </div>

            <!-- 操作 -->
            <div class="actions">
                <button class="action-btn" onclick="resetPage()">再生成一个</button>
                <button class="action-btn" onclick="shareQuote()">分享金句</button>
                <button class="action-btn primary" onclick="shareJournal()">分享手帐</button>
            </div>

            <!-- 分享选项 -->
            <div class="share-options" id="shareOptions" style="display: none; margin-top: 16px;">
                <div style="font-size: 13px; color: #8a9a8f; margin-bottom: 12px; text-align: center;">选择分享形式</div>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button class="action-btn" style="flex: 1; min-width: 120px;" onclick="generateShareCard('quote')">
                        ✨ 金句卡片
                    </button>
                    <button class="action-btn" style="flex: 1; min-width: 120px;" onclick="generateShareCard('journal')">
                        📝 手帐长图
                    </button>
                    <button class="action-btn" style="flex: 1; min-width: 120px;" onclick="generateShareCard('audio')">
                        🔊 语音片段
                    </button>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e0d5; padding: 12px 0; display: flex; justify-content: space-around; max-width: 600px; margin: 0 auto;">
            <button style="flex: 1; border: none; background: none; padding: 8px; cursor: pointer; color: #2d5a3d; font-size: 12px;">
                🎙️ 录音
            </button>
            <button style="flex: 1; border: none; background: none; padding: 8px; cursor: pointer; color: #8a9a8f; font-size: 12px;" onclick="alert('地图页即将上线 🗺️')">
                🗺️ 足迹
            </button>
            <button style="flex: 1; border: none; background: none; padding: 8px; cursor: pointer; color: #8a9a8f; font-size: 12px;" onclick="alert('我的手帐即将上线 📔')">
                📔 手帐
            </button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const submitBtn = document.getElementById('submitBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const uploadSection = document.getElementById('uploadSection');
        const resultSection = document.getElementById('resultSection');
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');

        let selectedFile = null;
        let selectedMode = 'quick';

        // 上传点击
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                uploadArea.querySelector('p').textContent = `已选择：${selectedFile.name}`;
            }
        });

        // 模式选择
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedMode = btn.dataset.mode;
            });
        });

        // 内容类型选择
        const contentTypeBtns = document.querySelectorAll('#contentTypeSelect .mode-btn');
        let selectedType = 'auto';
        contentTypeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                contentTypeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedType = btn.dataset.type;
            });
        });

        // 提交
        submitBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                alert('请先选择录音文件');
                return;
            }

            submitBtn.disabled = true;
            progress.classList.add('active');
            animateProgress();

            const formData = new FormData();
            formData.append('audio', selectedFile);
            formData.append('mode', selectedMode);
            formData.append('content_type', selectedType);

            try {
                const res = await fetch('/api/process-audio', {
                    method: 'POST',
                    body: formData,
                });
                const data = await res.json();
                showResult(data);
            } catch (err) {
                alert('生成失败：' + err.message);
                resetPage();
            }
        });

        // 进度条动画
        function animateProgress() {
            let width = 0;
            const interval = setInterval(() => {
                width += Math.random() * 15;
                if (width > 90) width = 90;
                progressFill.style.width = width + '%';
            }, 500);
            return interval;
        }

        // 展示结果
        function showResult(data) {
            uploadSection.style.display = 'none';
            resultSection.classList.add('active');

            // 金句
            document.getElementById('quoteText').textContent = data.quote || '今天也是值得记住的一天';

            // 标题和内容
            document.getElementById('resultTitle').textContent = data.title || '今日手帐';
            document.getElementById('resultContent').textContent = data.content || '';

            // 时间线
            const timelineList = document.getElementById('timelineList');
            timelineList.innerHTML = '';
            if (data.clips && data.clips.length > 0) {
                data.clips.forEach((clip, i) => {
                    const item = document.createElement('div');
                    item.className = 'timeline-item';
                    item.innerHTML = `
                        <div class="timeline-time">片段${i+1}</div>
                        <div class="timeline-dot"></div>
                        <div class="timeline-content">
                            ${(clip.tags || []).map(t => `<span class="timeline-tag">${t}</span>`).join('')}
                            <div class="timeline-text">${clip.transcript || ''}</div>
                        </div>
                    `;
                    timelineList.appendChild(item);
                });
            }

            // 自评
            const evalScores = document.getElementById('evalScores');
            evalScores.innerHTML = '';
            if (data.evaluation) {
                const ev = data.evaluation;
                const scores = [
                    { num: (ev.temperature || 0).toFixed(1), label: '温度感' },
                    { num: (vity || 0).toFixed(1), label: '真实感' },
                    { num: (ev.structure || 0).toFixed(1), label: '结构感' },
                    { num: (ev.completeness || 0).toFixed(1), label: '完整度' },
                    { num: (ev.naturalness || 0).toFixed(1), label: '自然度' },
                ];
                scores.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'eval-item';
                    item.innerHTML = `
                        <div class="eval-num">${s.num}</div>
                        <div class="eval-label">${s.label}</div>
                    `;
                    evalScores.appendChild(item);
                });
            }

            // 语音
            if (data.audio_url) {
                audioPlayer.src = data.audio_url;
                playBtn.style.display = 'flex';
            }
        }

        // 播放按钮
        playBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playBtn.textContent = '⏸';
            } else {
                audioPlayer.pause();
                playBtn.textContent = '▶';
            }
        });

        audioPlayer.addEventListener('ended', () => {
            playBtn.textContent = '▶';
        });

        // 重置
        function resetPage() {
            uploadSection.style.display = 'block';
            resultSection.classList.remove('active');
            progress.classList.remove('active');
            progressFill.style.width = '0%';
            submitBtn.disabled = false;
            selectedFile = null;
            uploadArea.querySelector('p').textContent = '点击上传录音文件';
            audioPlayer.pause();
            audioPlayer.src = '';
            playBtn.textContent = '▶';
        }

        // 分享金句
        function shareQuote() {
            const quote = document.getElementById('quoteText').textContent;
            navigator.clipboard.writeText(quote).then(() => {
                alert('金句已复制，快去发朋友圈吧！✨');
            });
        }

        // 分享手帐
        function shareJournal() {
            const options = document.getElementById('shareOptions');
            options.style.display = options.style.display === 'none' ? 'block' : 'none';
        }

        // 生成分享卡片
        function generateShareCard(type) {
            const quote = document.getElementById('quoteText').textContent;
            const title = document.getElementById('resultTitle').textContent;
            const content = document.getElementById('resultContent').textContent;

            let text = '';
            if (type === 'quote') {
                text = `✨ ${quote}\n\n—— 旅行手帐 AI`;
            } else if (type === 'journal') {
                text = `📝 ${title}\n\n${content.slice(0, 200)}...\n\n—— 旅行手帐 AI`;
            } else if (type === 'audio') {
                text = `🔊 我的旅行语音手帐，快来听听！\n\n—— 旅行手帐 AI`;
            }

            navigator.clipboard.writeText(text).then(() => {
                alert('分享内容已复制，快去粘贴吧！✨');
                document.getElementById('shareOptions').style.display = 'none';
            });
        }
    </script>
</body>
</html>
